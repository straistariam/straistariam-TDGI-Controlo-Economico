<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Gestor | Análise 3D</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
  <aside class="sidebar">
  <img src="../assets/TDGI_color.png" class="logo" alt="TDGI">

  <nav>
    <a href="dashboard-gestor.html"><i class="fa-solid fa-house"></i> Pagina Inicial</a>
    <a  href="meus-contratos.html"><i class="fa-solid fa-file-contract"></i> Meus Contratos</a>
    <a href="movimentos.html"><i class="fa-solid fa-receipt"></i> Movimentos</a>
    <a class="active" href="notas-encomenda.html"><i class="fa-solid fa-file-invoice"></i> Notas de Encomenda</a>
  </nav>

  <div class="sidebar-footer">
  <div class="sidebar-user">
    <div class="sidebar-user-icon">
      <i class="fa-solid fa-user"></i>
    </div>

    <div class="sidebar-user-info">
      <strong id="userName"></strong>
      <span id="userRole"></span>
    </div>
  </div>

  <button id="logoutBtn" class="sidebar-logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i>
  </button>
</div>
</aside>

<main class="main-content">
  <header class="topbar">
    <div>
      <h1>Notas de Encomenda</h1>
    </div>
  </header>

  <section class="current-analyses-section">
    <div class="filters">
      <select id="contratoSelect"></select>
      <select id="anoSelect"></select>
      <select id="mesSelect"></select>
      <select id="estadoSelect">
        <option value="">Todos os estados</option>
        <option value="POR_FATURAR">Por faturar</option>
        <option value="PARCIAL">Parcialmente faturado</option>
        <option value="FATURADO">Faturado</option>
      </select>
      <button id="pesquisarBtn">Pesquisar</button>
    </div>

    <div id="listaNotas" class="analises-list">
      <p>Selecione os filtros para consultar as notas de encomenda.</p>
    </div>
  </section>
</main>

<script src="../js/notas-encomenda.js"></script>
</body>
</html>
