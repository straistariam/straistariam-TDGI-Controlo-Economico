<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Diretor | Análise 3D</title>
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

  <aside class="sidebar">
  <img src="../assets/TDGI_color.png" class="logo" alt="TDGI">

  <nav>
    <a class="active"><i class="fa-solid fa-file-contract"></i> Direção</a>
    <a><i class="fa-solid fa-comment-dots"></i> Comentário final</a>
    <a><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
  </nav>

  <div class="sidebar-footer">
  <div class="sidebar-user">
    <div class="sidebar-user-icon">
      <i class="fa-solid fa-user"></i>
    </div>

    <div class="sidebar-user-info">
      <strong id="userName"></strong>
      <span id="userRole">teste</span>
    </div>
  </div>

  <button id="logoutBtn" class="sidebar-logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i>
    Sair
  </button>
</div>
</aside>

  

  <script src="../js/dashboard.js"></script>
</body>
</html>
